<title>Panel UX Proposal</title>
<style>
/* Layout: a phone-sized working copy of the panel on the left (the whole page on a phone), the reasons and the
   owner's notes beside or below it. Colours are the panel's own seven theme tokens (pvj/themes.d). */
:root { --bg: #121214; --cd: #1c1c20; --fg: #f2f1ec; --ln: #4a4a54; --mu: #a9a8a3; --ac: #f59e0b; --on: #1a1300;
  --warn: #b26a00; --bad: #b00020; --onbad: #ffffff; --shade: rgba(0,0,0,.6); color-scheme: dark; }
.phone[data-theme="night-red"] { --bg: #000000; --cd: #140000; --fg: #ff6a5c; --ln: #6a1a14; --mu: #c2564b; --ac: #ff3b30; --on: #000000; }
.phone[data-theme="light"] { --bg: #f4f3ef; --cd: #ffffff; --fg: #1c1c1c; --ln: #1c1c1c; --mu: #55554f; --ac: #c2410c; --on: #ffffff; color-scheme: light; }
.phone[data-theme="high-contrast"] { --bg: #000000; --cd: #000000; --fg: #ffffff; --ln: #ffffff; --mu: #e6e6e6; --ac: #ffff00; --on: #000000; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
.k { font: 500 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--mu); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

/* ---- the page around the phone ---- */
.stage { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 48px; display: grid; gap: 14px; }
.stage > * { min-width: 0; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 6px; }
.bar h1 { font-size: 15px; margin: 0 8px 0 0; }
.seg { display: inline-flex; border: 1.5px solid var(--ln); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--cd); padding: 0 12px; min-height: 40px; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--ac); color: var(--on); }
.bar select { border: 1.5px solid var(--ln); background: var(--cd); border-radius: 8px; min-height: 40px; padding: 0 8px; max-width: 100%; }
.side { display: flex; flex-direction: column; gap: 14px; }
.side h2 { font-size: 17px; margin: 0; text-wrap: balance; }
.side p { margin: 0; color: var(--mu); max-width: 65ch; }
.side details { border: 1.5px solid var(--ln); border-radius: 6px; background: var(--cd); padding: 0 12px; }
.side summary { cursor: pointer; font-weight: 600; padding: 12px 0; }
.side dl { margin: 0 0 12px; display: grid; gap: 10px; }
.side dt { color: var(--mu); font-size: 14px; }
.side dd { margin: 2px 0 0; font-size: 15px; max-width: 65ch; }
.side dd b { color: var(--ac); font-weight: 600; }
.notes textarea { width: 100%; min-height: 110px; border: 1.5px solid var(--ln); background: var(--cd); border-radius: 6px; padding: 10px; resize: vertical; }
@media (min-width: 900px) { .stage { grid-template-columns: 420px 1fr; align-items: start; } .bar { grid-column: 1 / -1; } .phonecol { position: sticky; top: 64px; } }

/* ---- the panel, as in pvj/web/app.css ---- */
.phone { position: relative; border: 1.5px solid var(--ln); border-radius: 16px; overflow: hidden; background: var(--bg); color: var(--fg);
  height: min(780px, calc(100dvh - 84px)); min-height: 480px; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.screen { padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.top h1, .screen h1 { margin: 0; font-size: 18px; }
.pill { border: 1.5px solid var(--ln); border-radius: 20px; padding: 4px 10px; background: var(--cd); white-space: nowrap; }
.card { border: 1.5px solid var(--ln); background: var(--cd); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h2 { margin: 0; font-size: 15px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex-grow: 1; }
.between { justify-content: space-between; }
.btn { border: 1.5px solid var(--ln); background: var(--cd); color: var(--fg); border-radius: 6px; padding: 0 12px; min-height: 44px; cursor: pointer; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.on, .pad.on { background: var(--ac); border-color: var(--ac); color: var(--on); }
.btn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.big { min-height: 56px; }
.btn.small { min-height: 34px; padding: 0 10px; font-size: 14px; }
.btn.danger { border-color: var(--bad); }
.progress { height: 8px; border: 1.5px solid var(--ln); border-radius: 4px; background: var(--bg); overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--ac); }
.banks { display: flex; gap: 8px; }
.banks .btn { flex: 1 1 0; }
.pads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad { border: 1.5px solid var(--ln); background: var(--cd); color: var(--fg); border-radius: 6px; min-height: 80px; cursor: pointer; display: flex;
  flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 8px; text-align: left; font-weight: 600; font-size: 13px; overflow: hidden; }
.pad .n { font: 400 10px ui-monospace, Menlo, monospace; color: var(--mu); }
.pad.on .n { color: var(--on); }
.pad.empty { border-style: dashed; color: var(--mu); }
.pad span.t { overflow-wrap: anywhere; }
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider label { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
.slider input[type=range], input.seek { width: 100%; height: 32px; accent-color: var(--ac); }
.tabs { display: flex; gap: 4px; border-top: 1.5px solid var(--ln); padding: 8px 12px; background: var(--bg); }
.tabs .btn { flex: 1 1 0; min-height: 48px; padding: 0 4px; }
.pin-row { display: flex; gap: 10px; justify-content: center; }
.pin-row input { width: 56px; height: 64px; border: 1.5px solid var(--ln); background: var(--cd); border-radius: 6px; font: 500 28px ui-monospace, Menlo, monospace; text-align: center; }
.text-input { border: 1.5px solid var(--ln); background: var(--cd); border-radius: 6px; min-height: 44px; padding: 0 10px; width: 100%; }
.msg { min-height: 1.4em; font-size: 14px; }
.msg.err { color: var(--ac); font-weight: 600; }
.list { display: flex; flex-direction: column; }
.list .item { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--ln); padding: 8px 0; font-size: 14px; flex-wrap: wrap; }
.list .item:first-child { border-top: 0; }
.list .item > span, .list .item > div { min-width: 0; overflow-wrap: anywhere; }
.list .item .btn { white-space: nowrap; flex: none; }
.list .item > span:first-child { flex: 1 1 10rem; }
.list .item > .row { flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.picker { position: absolute; inset: 0; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.picker .sheet { background: var(--bg); border: 1.5px solid var(--ln); border-radius: 12px 12px 0 0; width: 100%; max-height: 82%; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.sheet h2 { margin: 0; font-size: 17px; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--ln); white-space: nowrap; }
#preview { width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; background: #000; color: #bbb; display: flex; align-items: center; justify-content: center; font-size: 13px; text-align: center; padding: 8px; }

/* ---- proposed additions (would go at the end of app.css) ---- */
.strip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--cd); border-bottom: 1.5px solid var(--ln); }
.strip .what { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; }
.strip .what b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip.black { background: var(--fg); color: var(--bg); }
.strip.black .k { color: var(--bg); }
.chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--ln); white-space: nowrap; flex: none; }
.chip.active { background: var(--ac); border-color: var(--ac); color: var(--on); }
.chip.setup { background: var(--warn); border-color: var(--warn); color: var(--onbad); }
.chip.problem { background: var(--bad); border-color: var(--bad); color: var(--onbad); }
.chip.off { color: var(--mu); }
.dock { display: flex; gap: 8px; padding: 8px 12px 0; background: var(--bg); border-top: 1.5px solid var(--ln); }
.dock .btn { flex: 1 1 0; }
.dock + .tabs { border-top: 0; }
.banner { border: 1.5px dashed var(--ac); border-radius: 6px; padding: 8px 12px; font-size: 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.toast { position: absolute; left: 12px; right: 12px; bottom: 132px; z-index: 25; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.toast.err { background: var(--bad); color: var(--onbad); }
.toast button { background: none; border: 1.5px solid currentColor; border-radius: 6px; min-height: 36px; padding: 0 10px; font-weight: 700; cursor: pointer; color: inherit; flex: none; }
.switch { flex: none; width: 56px; height: 34px; border-radius: 17px; border: 1.5px solid var(--ln); background: var(--bg); position: relative; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: var(--mu); }
.switch[aria-checked="true"] { background: var(--ac); border-color: var(--ac); }
.switch[aria-checked="true"]::after { left: 25px; background: var(--on); }
.switch:disabled { opacity: .5; cursor: not-allowed; }
.group { display: flex; flex-direction: column; }
.group > .k { padding: 6px 0; }
.mrow { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--ln); min-height: 64px; }
.mrow .go { flex: 1; min-width: 0; background: none; border: 0; padding: 8px 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.mrow .go .nm { font-weight: 600; }
.mrow .go .st { font-size: 13px; color: var(--mu); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mrow .chev { color: var(--mu); font-size: 20px; flex: none; }
.back { align-self: flex-start; background: none; border: 0; padding: 8px 0; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.kv { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--ln); padding: 10px 0; font-size: 14px; }
.kv span:last-child { color: var(--mu); text-align: right; overflow-wrap: anywhere; min-width: 0; }
.np-title { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.np-left { font: 600 22px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.clip { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--ln); padding: 8px 0; }
.clip:first-child { border-top: 0; }
.clip .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.clip .nm small { display: block; color: var(--mu); font-size: 12px; }
.clip .btn { flex: none; min-width: 48px; }
.fold { border: 1.5px solid var(--ln); border-radius: 6px; background: var(--cd); padding: 0 12px; }
.fold summary { cursor: pointer; font-weight: 600; padding: 12px 0; min-height: 44px; }
.fold > div { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
.scene { min-height: 64px; text-align: left; display: flex; flex-direction: column; justify-content: center; }
.scene small { font-weight: 400; color: var(--mu); }
.scene.on small { color: var(--on); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (prefers-reduced-motion: no-preference) { .progress div { transition: width .3s linear; } .switch::after { transition: left .12s; } }
</style>

<div class="stage">
  <div class="bar" id="bar"></div>
  <div class="phonecol"><div class="phone" id="phone"></div></div>
  <div class="side" id="side"></div>
</div>

<script>

// A click-through proposal for the panel's navigation and screens. Nothing here talks to a box: the "box" is the
// object B below. Plain JavaScript and textContent only, with the panel's own helper h(), so each idea can be
// carried into pvj/web/app.js with little change. All names, sizes, addresses and codes are examples.
(function () {
  'use strict';
  function h(tag, attrs) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === false || v === null || v === undefined) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    var add = function (kid) {
      if (kid === null || kid === undefined || kid === false) return;
      if (Array.isArray(kid)) return kid.forEach(add);
      el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    };
    for (var i = 2; i < arguments.length; i++) add(arguments[i]);
    return el;
  }
  function $(id) { return document.getElementById(id); }
  function clock(sec) { sec = Math.max(0, Math.floor(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function short(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60); }
  function size(mb) { return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : mb.toFixed(1) + ' MB'; }
  function stem(f) { return f.replace(/\.[^.]+$/, ''); }

  // ---- the pretend box ---------------------------------------------------
  var RANK = { view: 1, live: 2, full: 3 };
  var ROLE = { view: 'Guest', live: 'Presenter', full: 'Owner' };
  var ROLE_CAN = { view: 'You can watch what is playing. You cannot change anything.',
    live: 'You can play clips, start ambience, black out and switch projectors. Settings stay with the owner.',
    full: 'You can do everything, including settings.' };
  var SHADERS = ['aurora', 'drift', 'ember', 'horizon', 'lattice', 'nebula', 'prism', 'pulse', 'silk', 'tide'];
  var B = {
    now: { kind: 'clip', file: 'loop-a.mkv', label: 'Loop A', dur: 200, pos: 74, loop: true },
    paused: false, blackout: false, faded: false, test: false, scene: '',
    mix: { opacity: 100, size: 100, x: 0, y: 0, speed: 100, volume: 100, transition: 'dip', duration: 1, rotate: 0, fh: false, fv: false, muted: false, overlay: false },
    media: [
      { n: '01_welcome.jpg', mb: 0.8, dur: 0, fmt: 'JPEG picture, 1920x1080', snd: 'no sound' },
      { n: '02_sponsors.jpg', mb: 0.9, dur: 0, fmt: 'JPEG picture, 1920x1080', snd: 'no sound' },
      { n: 'friday_film_4k.mov', mb: 6200, dur: 5820, fmt: 'ProRes 3840x2160, 24 fps', snd: 'stereo', adv: 'Too heavy for this box and likely to stutter. Convert it to H.264, 1920x1080 (the manual has a recipe).' },
      { n: 'intro.mkv', mb: 38, dur: 42, fmt: 'H.264 1920x1080, 30 fps', snd: 'stereo' },
      { n: 'logo.png', mb: 0.6, dur: 0, fmt: 'PNG picture, 1920x1080', snd: 'no sound' },
      { n: 'loop-a.mkv', mb: 164, dur: 200, fmt: 'H.264 1920x1080, 30 fps', snd: 'no sound' },
      { n: 'loop-b.mkv', mb: 151, dur: 180, fmt: 'H.264 1920x1080, 30 fps', snd: 'no sound' },
      { n: 'outro.mkv', mb: 44, dur: 55, fmt: 'H.264 1920x1080, 30 fps', snd: 'stereo' },
      { n: 'sting.mkv', mb: 9, dur: 8, fmt: 'H.264 1920x1080, 30 fps', snd: 'stereo' },
      { n: 'tunnel.mkv', mb: 210, dur: 240, fmt: 'H.264 1920x1080, 30 fps', snd: 'no sound' }],
    usb: { drive: 'NXLX-USB', files: [{ n: 'trailer.mp4', mb: 1240, dur: 150 }, { n: 'loop-a.mkv', mb: 164, dur: 200 }] },
    banks: ['Bank A', 'Bank B', 'Bank C'].map(function (name, b) {
      var pads = []; for (var i = 0; i < 12; i++) pads.push({ file: '', label: '', ending: 'loop' });
      if (b === 0) [['intro.mkv', 'Intro', 'stop'], ['tunnel.mkv', 'Tunnel', 'loop'], ['loop-a.mkv', 'Loop A', 'loop'], ['loop-b.mkv', 'Loop B', 'loop'], ['sting.mkv', 'Sting', 'hold'], ['outro.mkv', 'Outro', 'stop']]
        .forEach(function (p, i) { pads[i] = { file: p[0], label: p[1], ending: p[2] }; });
      return { name: name, pads: pads };
    }),
    free: 84.4, proj: [{ n: 'Main wall', on: true, input: 'HDMI 1', lamp: 412 }, { n: 'Painting wall', on: false, input: 'HDMI 1', lamp: 1310 }],
    uploads: [], copy: null
  };
  // Modules and settings pages. on: the switch; setup: the first-run step is done; armed: today's second switch in the card.
  var M = {
    projector: { on: true, setup: true }, shaders: { on: true, setup: true }, scheduler: { on: true, setup: true, armed: true },
    autostart: { on: true, setup: true }, audio: { on: true, setup: true }, appearance: { on: true, setup: true },
    streams: { on: false, setup: false }, mapper: { on: false, setup: true }, wall: { on: false, setup: false },
    midi: { on: true, setup: false, armed: false }, dmx: { on: false, setup: false, armed: false }, osc: { on: false, setup: false, armed: false },
    access: { on: true, setup: true }, network: { on: false, setup: false }, updates: { on: true, setup: true }, settings: { on: true, setup: true },
    support: { on: false, setup: false }, health: { on: true, setup: true }, box: { on: true, setup: true }, diag: { on: true, setup: true },
    restart: { on: true, setup: true }, reset: { on: true, setup: true }
  };
  var GROUPS = [['room', 'Room and everyday'], ['picture', 'Sources and picture'], ['control', 'Controllers'], ['once', 'Set once'], ['box', 'This box']];
  var MODS = [
    { id: 'projector', name: 'Projectors', old: 'Projector control', group: 'room', sw: true, find: 'pjlink epson lamp input mute on off',

      active: function () { var n = B.proj.filter(function (p) { return p.on; }).length; return n ? n + ' of ' + B.proj.length + ' switched on' : ''; },
      ready: function () { return B.proj.length + ' projectors, all off'; } },
    { id: 'shaders', name: 'Ambience (Shaders and Vibes)', old: 'Shaders and Vibes', group: 'room', sw: true, find: 'vibes isf shader ambience generator',
      about: 'Moving pictures drawn by the box itself. Vibes plays them endlessly with one tap: the Ambience button on Live and Room.',
      active: function () { return B.now && B.now.kind === 'vibes' ? 'Vibes is on: ' + SHADERS[B.now.idx] : ''; }, ready: function () { return '10 shaders, 8 in Vibes, 3 minutes each'; } },
    { id: 'scheduler', name: 'Weekly schedule', old: 'Weekly schedule', group: 'room', sw: true, find: 'time clock timer opening closing',
      about: 'Start ambience, play a clip, black out or switch projectors at set times on chosen days.',
      need: 'add a first entry', steps: [{ t: 'Check the box clock', hint: 'The box says it is Saturday 16:42. A Pi has no clock battery, so check this after a power cut.', fields: [], go: 'The clock is right' }, { t: 'Add your first entry', hint: 'For example: every day at 17:00, start ambience.', fields: ['Time (for example 17:00)', 'What happens'], go: 'Add entry' }],
      ready: function () { return '3 entries. Next: Start ambience, today 17:00'; } },
    { id: 'autostart', name: 'At power-up', old: 'Autostart', group: 'room', find: 'autostart boot start crash usb',
      about: 'What the box plays by itself when it gets power, and after a crash.', ready: function () { return 'Starts ambience (Vibes) after 10 seconds'; } },
    { id: 'audio', name: 'Sound output', old: 'Sound output', group: 'room', find: 'audio hdmi headphones speaker test tone volume',
      about: 'Where the sound goes, with a test tone for left and right.', ready: function () { return 'Automatic: the HDMI port with the screen'; } },
    { id: 'appearance', name: 'Look of this panel', old: 'Appearance', group: 'room', find: 'theme colour color dark night red accent contrast',
      about: 'The panel\'s theme and accent colour. Night red keeps a dark room dark.', ready: function () { return 'Theme: ' + ({ 'dark-stage': 'Dark stage', 'night-red': 'Night red', light: 'Light', 'high-contrast': 'High contrast' })[UI.theme]; } },
    { id: 'streams', name: 'Network streams', old: 'Streams: SRT, RTSP, RTMP', group: 'picture', sw: true, find: 'srt rtsp rtmp stream camera address',
      about: 'Save stream addresses and play them like clips.', need: 'add a stream address',
      steps: [{ t: 'Add your first stream', hint: 'Paste the address the sender gave you. It starts with srt://, rtsp:// or rtmp://.', fields: ['Name', 'Address'], go: 'Save stream' }], ready: function () { return '1 stream saved'; } },
    { id: 'mapper', name: 'Projection mapping', old: 'Projection mapper', group: 'picture', sw: true, find: 'mapper warp quad grid triangle surface corner',
      about: 'Warp the picture onto surfaces. The editor is on Mix, under Layers.', ready: function () { return 'No surfaces yet. Open the editor on Mix'; } },
    { id: 'wall', name: 'Video wall and sync', old: 'Video wall and sync', group: 'picture', sw: true, find: 'sync server client wall tile bezel boxes',
