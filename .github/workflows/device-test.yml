name: Device test

# Runs on a real board registered as a self-hosted runner with the label "pvj-device".
# Manual start only: it never runs for pushes or pull requests, so nobody else's code reaches the board.
on:
  workflow_dispatch:
    inputs:
      play:
        description: 'Also play a test pattern on the attached display'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: device-test
  cancel-in-progress: false

jobs:
  device:
    # Only Anthony may start it. This names the person, not the repository owner: when the repository belongs to
    # an organisation, `github.repository_owner` is the organisation and no person would ever match it.
    # Anyone else (or a rename of the account) makes it fail closed, which is the safe direction.
    if: github.actor == 'anthonygiglio'
    runs-on: [self-hosted, pvj-device]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the device test
        env:
          PVJ_DEVICE_PLAY: ${{ inputs.play && '1' || '0' }}
        run: tools/device-test.sh device-report
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-report
          path: device-report/
          if-no-files-found: warn
